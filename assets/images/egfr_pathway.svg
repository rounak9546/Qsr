<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="membraneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="egfrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="kinaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Extracellular Region Label -->
  <text x="40" y="45" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">EXTRACELLULAR SPACE</text>
  <text x="40" y="65" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="700">Ligands: EGF, TGF-α</text>

  <!-- Cell Membrane -->
  <rect x="20" y="110" width="860" height="36" rx="6" fill="url(#membraneGrad)" stroke="#64748b" stroke-width="1"/>
  <text x="40" y="133" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PLASMA MEMBRANE (LIPID BILAYER)</text>

  <!-- Intracellular Region Label -->
  <text x="40" y="175" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CYTOPLASM (INTRACELLULAR)</text>

  <!-- Ligand Molecule -->
  <circle cx="430" cy="55" r="14" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="470" cy="55" r="14" fill="#f59e0b" filter="url(#glow)"/>
  <text x="450" y="59" fill="#0f172a" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">EGF</text>

  <!-- EGFR Dimer (Receptor Pair) -->
  <!-- Receptor 1 -->
  <path d="M 420 70 C 420 85, 410 95, 425 110 L 425 146 L 415 165 C 410 185, 410 205, 425 220 Z" fill="url(#egfrGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Receptor 2 -->
  <path d="M 480 70 C 480 85, 490 95, 475 110 L 475 146 L 485 165 C 490 185, 490 205, 475 220 Z" fill="url(#egfrGrad)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Kinase Catalytic Domain Box -->
  <rect x="395" y="215" width="110" height="55" rx="8" fill="url(#kinaseGrad)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glow)"/>
  <text x="450" y="238" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TK DOMAIN</text>
  <text x="450" y="254" fill="#ccfbf1" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">ATP-Binding Pocket</text>

  <!-- Phosphorylation Sites (P) -->
  <circle cx="390" cy="285" r="10" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
  <text x="390" y="289" fill="#713f12" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P</text>

  <circle cx="450" cy="295" r="10" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
  <text x="450" y="299" fill="#713f12" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P</text>

  <circle cx="510" cy="285" r="10" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
  <text x="510" y="289" fill="#713f12" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P</text>

  <!-- Drug Target / Inhibitor Site (TKI) -->
  <rect x="530" y="222" width="130" height="42" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="595" y="240" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TKI INHIBITION</text>
  <text x="595" y="254" fill="#fca5a5" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Gefitinib / Osimertinib</text>
  <line x1="530" y1="243" x2="505" y2="243" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Clinical Resistance Mutations Highlight -->
  <rect x="230" y="220" width="145" height="50" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="302" y="238" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESISTANCE SITES</text>
  <text x="302" y="252" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Exon 19 del | L858R | T790M</text>
  <line x1="375" y1="245" x2="395" y2="245" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Pathway 1: MAPK / ERK Cascade (Left) -->
  <line x1="385" y1="295" x2="220" y2="340" stroke="#06b6d4" stroke-width="2"/>
  <rect x="160" y="330" width="120" height="34" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="220" y="352" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GRB2 / SOS → RAS</text>

  <line x1="220" y1="364" x2="220" y2="390" stroke="#06b6d4" stroke-width="2"/>
  <rect x="160" y="390" width="120" height="34" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="220" y="412" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">RAF → MEK → ERK</text>

  <rect x="140" y="440" width="160" height="26" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="457" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CELL PROLIFERATION</text>

  <!-- Pathway 2: PI3K / AKT Cascade (Center) -->
  <line x1="450" y1="305" x2="450" y2="340" stroke="#10b981" stroke-width="2"/>
  <rect x="390" y="340" width="120" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="450" y="362" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PI3K Activation</text>

  <line x1="450" y1="374" x2="450" y2="400" stroke="#10b981" stroke-width="2"/>
  <rect x="390" y="400" width="120" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="450" y="422" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AKT / mTOR</text>

  <rect x="370" y="445" width="160" height="26" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#34d399" stroke-width="1"/>
  <text x="450" y="462" fill="#d1fae5" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CELL SURVIVAL &amp; GROWTH</text>

  <!-- Pathway 3: STAT Cascade (Right) -->
  <line x1="515" y1="295" x2="680" y2="340" stroke="#a855f7" stroke-width="2"/>
  <rect x="620" y="330" width="120" height="34" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="680" y="352" fill="#c084fc" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">JAK1 / JAK2</text>

  <line x1="680" y1="364" x2="680" y2="390" stroke="#a855f7" stroke-width="2"/>
  <rect x="620" y="390" width="120" height="34" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="680" y="412" fill="#c084fc" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STAT3 / STAT5</text>

  <rect x="600" y="440" width="160" height="26" rx="4" fill="#581c87" fill-opacity="0.4" stroke="#c084fc" stroke-width="1"/>
  <text x="680" y="457" fill="#f3e8ff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANGIOGENESIS &amp; METASTASIS</text>
</svg>
